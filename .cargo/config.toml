[build]
rustflags = [
  "-C", "target-cpu=native",
  "-A", "unexpected_cfgs",
  "-A", "deprecated",
  "-A", "unused_imports",
  "-A", "mismatched_lifetime_syntaxes",
  "-A", "unused_unsafe",
  "-A", "unpredictable_function_pointer_comparisons",
  "-A", "static_mut_refs",
  "-A", "unused_attributes",
  "-A", "unknown_lints",
  "-A", "renamed_and_removed_lints",
  "-A", "useless_ptr_null_checks",
  "-A", "unused_must_use",
]

[alias]
# Mutating formatter for local development and a separate read-only CI check.
holo-fmt = ["fmt", "--all"]
holo-fmt-check = ["fmt", "--all", "--", "--check"]

# Compile every target and feature without executing tests or benchmarks.
holo-check = ["check", "--workspace", "--all-targets", "--all-features"]

# Keep the lint contract aligned with the repository's verified quality gate.
holo-clippy = [
  "clippy",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--",
  "-D", "warnings",
]

# Tests are serialized to avoid resource contention in the larger integration suites.
# Benchmark targets are intentionally reserved for `holo-bench`.
holo-test = [
  "test",
  "--workspace",
  "--all-features",
  "--no-fail-fast",
  "-j", "1",
]

# Validate benchmark targets without automatically executing the entire benchmark fleet.
holo-bench = ["bench", "--workspace", "--all-features", "--no-run"]

# --- CUDA Environment ---
# Ensures Cargo build scripts find the CUDA toolkit regardless of shell inheritance.
# Explicit shell-level overrides still win because `force` is false.
[env]
CUDA_PATH = { value = "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v12.8", force = false }
CUDA_ROOT = { value = "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v12.8", force = false }

# Prevent stack exhaustion in crates with deep generic monomorphization.
RUST_MIN_STACK = { value = "134217728", force = false }
