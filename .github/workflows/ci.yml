name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, check, and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo holo-fmt-check
      - run: cargo holo-check
      - run: cargo holo-clippy

  test:
    name: Mandatory correctness gate
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Benchmarks do not execute ordinary #[test] functions.  Keep this
      # explicit gate ahead of any benchmark-admission workflow or artifact.
      - run: cargo test --release --workspace --all-features
