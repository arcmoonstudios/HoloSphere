[package]
name = "holosphere"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "HoloSphere is a Hierarchical Navigable Semantic Query Resolver (HNSQR) — high-performance multimodal retrieval engine with bounded hierarchical routing, complex-valued geometry, certified block bounds, and adaptive cost-based planning."
readme = "README.md"
repository = "https://github.com/arcmoonstudios/holosphere"
keywords = ["hnsw", "vector-search", "similarity-search", "graph", "embedding", "database", "retrieval"]
categories = ["algorithms", "data-structures", "database-implementations", "science"]
authors = ["Lord Xyn <lordxyn@proton.me>"]

[features]
default = []
loom = ["dep:loom"]

[dependencies]
# Concurrency & Locking
parking_lot = "0.12"
rayon = "1.10" # Updated version
memmap2 = "0.9"
roaring = { version = "0.11", features = ["serde"] }
tokio = { version = "1.38", features = ["full"] }
bytes = "1.6"
axum = "0.8"
tower-http = { version = "0.7", features = ["cors"] }
async-trait = "0.1"
num_cpus = "1.16"

# Data Structures & Utilities
smallvec = { version = "1.13", features = ["serde"] } # Updated version, enable serde feature
uuid = { version = "1.8", features = ["v4", "serde"] } # Enable v4 and serde
rand = "0.10"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2.0" # For error handling derive

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0" # For Node metadata
bincode = "1.3"

# Quantum Complex Numbers
num-complex = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
crc32fast = "1.4"
bytemuck = { version = "1.16", features = ["derive"] }

# Concurrency testing (optional)
loom = { version = "0.7", optional = true }

[dev-dependencies]
tempfile = "3.10"

