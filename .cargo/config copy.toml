# --- CUDA Environment ---
# Permanent fix: ensures cargo build-scripts always find the CUDA toolkit
# regardless of shell environment inheritance. 'force = false' means any
# explicit shell-level override (e.g. a different CUDA version) still wins.
[env]
CUDA_PATH  = { value = "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v12.8", force = false }
CUDA_ROOT  = { value = "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v12.8", force = false }
# Increase rustc thread stack size to prevent STATUS_STACK_BUFFER_OVERRUN on
# large crates with deep generic monomorphization (rune-gpf, rune-lore, rune-fin).
# Default is 8 MB; 128 MB covers the deepest observed recursion in this workspace.
RUST_MIN_STACK = { value = "134217728", force = false }
