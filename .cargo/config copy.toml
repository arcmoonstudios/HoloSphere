[build]
rustflags = [
  "-A", "unexpected_cfgs",
  "-A", "deprecated",
  "-A", "dead_code",
  "-A", "unused_imports",
  "-A", "mismatched_lifetime_syntaxes",
  "-A", "unused_unsafe",
  "-A", "unpredictable_function_pointer_comparisons",
  "-A", "static_mut_refs",
  "-A", "unused_attributes",
  "-A", "unknown_lints",
  "-A", "renamed_and_removed_lints",
  "-A", "useless_ptr_null_checks",
  "-A", "unused_must_use"
]

[alias]
# --- Workspace Commands ---

# Doctrine boundary law validator. See .Ai-Comms/AGREEMENT.md.
rune-check-boundary = ["run", "-p", "xtask", "--bin", "check-boundary", "--"]

rune-fmt = [
  "fmt",
  "--all",
  "--",
  "--config-path",
  "X:\\_Repos\\rune-substrate"
]

rune-check = [
    "check",
    "--workspace",
    "--lib",
    "--bins"
]

rune-clippy = [
    "clippy",
    "--workspace",
    "--lib",
    "--bins",
    "--",
    "-W", "clippy::all",
    "-W", "clippy::pedantic",
    "-W", "clippy::nursery",
    "-W", "clippy::cargo",
    "-W", "rust_2018_idioms",
    "-W", "rust_2021_compatibility",
    "-W", "rust_2024_compatibility",
    "-A", "clippy::multiple_crate_versions",
    "-A", "clippy::missing_errors_doc",
    "-A", "clippy::missing_panics_doc",
    "-A", "clippy::too_many_lines",
    "-A", "clippy::module_name_repetitions",
    "-A", "clippy::cast_precision_loss",
    "-A", "clippy::cast_possible_truncation",
    "-A", "clippy::cast_sign_loss",
    "-A", "clippy::similar_names",
    "-A", "clippy::must_use_candidate",
    "-A", "clippy::needless_pass_by_ref_mut",
    "-A", "clippy::unused_async",
    "-A", "clippy::non_std_lazy_statics",
    "-A", "clippy::significant_drop_tightening",
    "-A", "clippy::redundant_clone",
    "-A", "clippy::uninlined_format_args",
    "-A", "clippy::option_if_let_else",
    "-A", "clippy::branches_sharing_code",
    "-A", "clippy::unnecessary_wraps",
    "-A", "clippy::inline_always",
    "-A", "clippy::format_collect",
    "-A", "clippy::unused_self",
    "-A", "clippy::redundant_closure",
    "-A", "clippy::needless_continue",
    "-A", "clippy::manual_let_else",
    "-A", "clippy::significant_drop_in_scrutinee",
    "-A", "clippy::type_complexity",
    "-A", "clippy::missing_const_for_fn",
    "-A", "clippy::trivially_copy_pass_by_ref",
    "-A", "clippy::single_match",
    "-A", "clippy::match_same_arms",
    "-A", "clippy::let_underscore_untyped",
    "-A", "clippy::expl_impl_clone_on_copy",
    "-A", "clippy::too_many_arguments",
    "-A", "clippy::format_push_string",
    "-A", "clippy::items_after_statements",
    "-A", "clippy::struct_excessive_bools",
    "-A", "clippy::used_underscore_binding",
    "-A", "clippy::collection_is_never_read",
    "-A", "clippy::unnecessary_map_or",
    "-A", "clippy::iter_nth_zero",
    "-A", "clippy::manual_clamp",
    "-A", "clippy::ptr_as_ptr",
    "-A", "clippy::suboptimal_flops",
    "-A", "clippy::manual_midpoint",
    "-A", "clippy::large_stack_arrays",
    "-A", "clippy::doc_markdown",
    "-A", "clippy::wildcard_imports",
    "-A", "clippy::enum_variant_names"
]

rune-test = [
  "test",
  "--workspace",
  "--all-features",
  "--all-targets",
  "--no-fail-fast",
  "-j", "1"
]

# --- Test Aliases ---

rune-test-anvil = ["test", "-p", "rune-anvil", "--all-features"]
rune-test-bench = ["test", "-p", "rune-bench", "--all-features"]
rune-test-core = ["test", "-p", "rune-core", "--all-features"]
rune-test-cros = ["test", "-p", "rune-cros", "--all-features"]
rune-test-curs = ["test", "-p", "rune-curs", "--all-features"]
rune-test-evo = ["test", "-p", "rune-evo", "--all-features"]
rune-test-ext = ["test", "-p", "rune-ext", "--all-features"]
rune-test-ffi = ["test", "-p", "rune-ffi", "--all-features"]
rune-test-fin = ["test", "-p", "rune-fin", "--all-features"]
rune-test-forge = ["test", "-p", "rune-forge", "--all-features"]
rune-test-gate = ["test", "-p", "rune-gate", "--all-features"]
rune-test-geolex = ["test", "-p", "rune-geolex", "--all-features"]
rune-test-gpf = ["test", "-p", "rune-gpf", "--all-features"]
rune-test-hydron = ["test", "-p", "rune-hydron", "--all-features"]
rune-test-ings = ["test", "-p", "rune-ings", "--all-features"]
rune-test-lore = ["test", "-p", "rune-lore", "--all-features"]
rune-test-mcp = ["test", "-p", "rune-mcp", "--all-features"]
rune-test-net = ["test", "-p", "rune-net", "--all-features"]
rune-test-neuvox = ["test", "-p", "rune-neuvox", "--all-features"]
rune-test-noecap = ["test", "-p", "rune-noecap", "--all-features"]
rune-test-noesis = ["test", "-p", "rune-noesis", "--all-features"]
rune-test-noetix = ["test", "-p", "rune-noetix", "--all-features"]
rune-test-p4cion = ["test", "-p", "rune-p4cion", "--all-features"]
rune-test-ress = ["test", "-p", "rune-ress", "--all-features"]
rune-test-scribe = ["test", "-p", "rune-scribe", "--all-features"]
rune-test-synthion = ["test", "-p", "rune-synthion", "--all-features"]
rune-test-vs = ["test", "-p", "rune-vs", "--all-features"]
rune-test-xfer = ["test", "-p", "rune-xfer", "--all-features"]
rune-test-xyco = ["test", "-p", "rune-xyco", "--all-features"]

# --- Bench Aliases ---

rune-bench-bench = ["bench", "-p", "rune-bench", "--all-features"]
rune-bench-core = ["bench", "-p", "rune-core", "--all-features"]
rune-bench-curs = ["bench", "-p", "rune-curs", "--all-features"]
rune-bench-evo = ["bench", "-p", "rune-evo", "--all-features"]
rune-bench-exgate = ["bench", "-p", "rune-exgate", "--all-features"]
rune-bench-fin = ["bench", "-p", "rune-fin", "--all-features"]
rune-bench-geolex = ["bench", "-p", "rune-geolex", "--all-features"]
rune-bench-hydron = ["bench", "-p", "rune-hydron", "--all-features"]
rune-bench-noecap = ["bench", "-p", "rune-noecap", "--all-features"]
rune-bench-noesis = ["bench", "-p", "rune-noesis", "--all-features"]
rune-bench-noetix = ["bench", "-p", "rune-noetix", "--all-features"]
rune-bench-p4cion = ["bench", "-p", "rune-p4cion", "--all-features"]
rune-bench-vs = ["bench", "-p", "rune-vs", "--all-features"]
rune-bench-xyco = ["bench", "-p", "rune-xyco", "--all-features"]

# --- Run Aliases ---

rune-xyco = ["run", "--package", "xyco-tests", "--all-features", "--"]

# --- Clippy Aliases (General) ---

rune-clippy-anvil = "clippy -p rune-anvil --no-deps --lib --bins --tests --benches -- -D warnings -W clippy::all -W clippy::pedantic -W clippy::nursery -W clippy::cargo -W rust_2018_idioms -W rust_2021_compatibility -W rust_2024_compatibility -A clippy::multiple_crate_versions -A clippy::missing_errors_doc -A clippy::missing_panics_doc -A clippy::too_many_lines -A clippy::module_name_repetitions -A clippy::cast_precision_loss -A clippy::cast_possible_truncation -A clippy::cast_sign_loss -A clippy::similar_names -A clippy::must_use_candidate -A clippy::needless_pass_by_ref_mut -A clippy::unused_async -A clippy::non_std_lazy_statics -A clippy::significant_drop_tightening -A clippy::redundant_clone -A clippy::uninlined_format_args -A clippy::option_if_let_else -A clippy::branches_sharing_code -A clippy::unnecessary_wraps -A clippy::inline_always -A clippy::format_collect -A clippy::unused_self -A clippy::redundant_closure -A clippy::needless_continue -A clippy::manual_let_else -A clippy::significant_drop_in_scrutinee -A clippy::type_complexity -A clippy::missing_const_for_fn -A clippy::trivially_copy_pass_by_ref -A clippy::single_match -A clippy::match_same_arms -A clippy::let_underscore_untyped -A clippy::expl_impl_clone_on_copy -A clippy::too_many_arguments -A clippy::format_push_string -A clippy::items_after_statements -A clippy::struct_excessive_bools -A clippy::used_underscore_binding -A clippy::collection_is_never_read -A clippy::unnecessary_map_or -A clippy::iter_nth_zero -A clippy::manual_clamp -A clippy::ptr_as_ptr -A clippy::suboptimal_flops -A clippy::manual_midpoint -A clippy::large_stack_arrays -A clippy::doc_markdown -A clippy::wildcard_imports -A clippy::enum_variant_names"
rune-clippy-bench = "clippy -p rune-bench --no-deps --lib --bins --tests --benches -- -D warnings -W clippy::all -W clippy::pedantic -W clippy::nursery -W clippy::cargo -W rust_2018_idioms -W rust_2021_compatibility -W rust_2024_compatibility -A clippy::multiple_crate_versions -A clippy::missing_errors_doc -A clippy::missing_panics_doc -A clippy::too_many_lines -A clippy::module_name_repetitions -A clippy::cast_precision_loss -A clippy::cast_possible_truncation -A clippy::cast_sign_loss -A clippy::similar_names -A clippy::must_use_candidate -A clippy::needless_pass_by_ref_mut -A clippy::unused_async -A clippy::non_std_lazy_statics -A clippy::significant_drop_tightening -A clippy::redundant_clone -A clippy::uninlined_format_args -A clippy::option_if_let_else -A clippy::branches_sharing_code -A clippy::unnecessary_wraps -A clippy::inline_always -A clippy::format_collect -A clippy::unused_self -A clippy::redundant_closure -A clippy::needless_continue -A clippy::manual_let_else -A clippy::significant_drop_in_scrutinee -A clippy::type_complexity -A clippy::missing_const_for_fn -A clippy::trivially_copy_pass_by_ref -A clippy::single_match -A clippy::match_same_arms -A clippy::let_underscore_untyped -A clippy::expl_impl_clone_on_copy -A clippy::too_many_arguments -A clippy::format_push_string -A clippy::items_after_statements -A clippy::struct_excessive_bools -A clippy::used_underscore_binding -A clippy::collection_is_never_read -A clippy::unnecessary_map_or -A clippy::iter_nth_zero -A clippy::manual_clamp -A clippy::ptr_as_ptr -A clippy::suboptimal_flops -A clippy::manual_midpoint -A clippy::large_stack_arrays -A clippy::doc_markdown -A clippy::wildcard_imports -A clippy::enum_variant_names"
