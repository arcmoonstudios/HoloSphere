path = "src/bin/hnsqr_codegraph.rs"

[[bin]]
name = "hnsqr_contextgraph"
path = "src/bin/hnsqr_contextgraph.rs"

[profile.dev]
incremental = false
lto = false
opt-level = 1
overflow-checks = true

# Dependencies always optimised — rayon, serde, bincode are painfully slow at opt-level=0
[profile.dev.package."*"]
opt-level = 2

[profile.test]
inherits = "dev"
incremental = false
lto = false
overflow-checks = true

[profile.release]
codegen-units = 1
debug = false
lto = "fat"
opt-level = 3
overflow-checks = true
panic = "abort"
strip = "symbols"

[profile.release-with-debug]
debug = true
inherits = "release"
overflow-checks = true
strip = false

[profile.bench]
codegen-units = 1
lto = false
opt-level = 3
overflow-checks = true

[lints.clippy]
all = "allow"
cargo = "allow"
multiple_crate_versions = "allow"
nursery = "allow"
pedantic = "allow"
field_reassign_with_default = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
doc_lazy_continuation = "allow"

# Metadata for docs.rs (optional but recommended)
[package.metadata.docs.rs]
all-features = true
