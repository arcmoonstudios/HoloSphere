name: Bug report
description: Report reproducible incorrect behavior.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please do not report security vulnerabilities here; see SECURITY.md."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include commands, input, and expected versus actual behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: HoloSphere version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Rust version, and enabled Cargo features.
    validations:
      required: true
